# The second harness. It is not the entry bar and it does not become one.
#
# `cargo xtask qualify` is the entry bar and the only spelling of it. Its
# `tests` stage runs `cargo test --locked --workspace` with the pinned
# toolchain and nothing else, and that stage is untouched by this file. nextest
# is a separately installed binary, so folding it into qualify would make the
# bar depend on what a working machine happens to have — the reason cargo-deny
# runs beside the bar rather than inside it, written once in `deny.toml` and not
# restated here. This file configures a SECOND reading of the population that
# stage already runs, and `.github/workflows/harness.yml` is where it runs.
#
# WHY A SECOND READING IS WORTH HAVING AT ALL. The hosted qualify job runs two
# hosts because the road claims to be one road and two hosts can disagree. Two
# harnesses stand on that same argument one level in. `cargo test` runs every
# test of a binary as a thread inside ONE process; nextest runs each test in a
# process of its own. The two can therefore only disagree where a result depends
# on something a process shares — a static, an environment variable, a working
# directory, a file another test wrote. The repository laws walk real trees and
# write scratch directories, so that is not a theoretical class here.
#
# `cargo test --locked --workspace` remains the entry bar's test road and keeps
# the workspace's doctests. nextest runs no doctests; it supplements that road
# with process-per-test isolation and never replaces it.
#
# `the_nextest_timeout_reversal` in `xtask/src/checks/alarms.rs` is ignored by
# ordinary runs. Only the reversal command in `.github/workflows/harness.yml`
# selects it and lifts that ignore.
#
# WHAT THIS FILE CLAIMS: that the workspace's harness tests pass under
# process-per-test isolation, and that the configuration below is the one a run
# used. WHAT IT DOES NOT CLAIM: anything about doctests; anything about a test a
# macro generated or deleted, because nextest lists what the compiled binaries
# report and this repository's readers already state that ceiling; and anything
# about the entry bar, which is `cargo xtask qualify` and is defined by the
# ordered stage table in `xtask/src/qualification.rs` alone.
#
# WHERE THIS FILE IS COUNTED: in the roster `xtask/src/main.rs` holds, which
# that file states is the only statement of how many repository laws there are.
# `alarm-artifacts-are-present-and-distinct` reads this file,
# `.cargo/mutants.toml`, and the two workflows that call them, and refuses when
# one is deleted, when one is emptied, or when the `reversal` profile below
# stops departing from `default`. It is still in neither RED-TWIN denominator,
# for the reason `deny-reversal.toml` gives about itself — the red populations
# xtask joins against are testpak's tests and its compile-fail fixtures, and a
# configuration beside a hosted workflow is neither — and the roster is the seat
# the dependency gate's own artifacts took for exactly that reason.
#
# The opening condition written here has therefore been discharged, and it was
# the one admission requirement this surface arrived without. What the law
# establishes is that the FILES are there, and deliberately not that any hosted
# step still runs them: a step somebody edits out of `harness.yml` leaves every
# file exactly where it is, and that removal is caught by review alone. That
# second half is the same road the dependency gate names and does not reach — a
# hosted run publishing the roster of what it EXECUTED — and
# `xtask/src/checks/alarms.rs` carries the ceiling as an executed test rather
# than as this sentence.

# CHOSEN: the exact version, and it is a staleness guard rather than
# housekeeping. A key this file writes that a nextest no longer reads would
# otherwise be a decision that stopped applying in silence — the failure mode
# `clippy.toml` says it could not build a guard for. nextest refuses to run at
# all when the binary is older than the version its configuration requires, which
# is the tool's documented behaviour and NOT measured here: proving it needs an
# older nextest and there is none on any machine this has run on. What IS
# measured is that 0.9.132 accepts every key below. Raising the pin is a visible
# act either way.
nextest-version = "0.9.132"

[profile.default]
# CHOSEN: report every failure. nextest's own default stops the run at the first
# one. The qualification road already settles this question and settles it the
# other way for a population like this: fail fast ACROSS stages that share a
# cause, report everything WITHIN a stage whose findings do not. Tests are
# independent of one another, so a run that stopped at the first red would cost
# a round trip per failure to learn what one run already knew.
fail-fast = false

# CHOSEN: zero, restating nextest's default AS a decision, because this is the
# one setting whose wrong value would be invisible. A retried test that passes
# on the second attempt is reported as a pass, and a flaky test converted into a
# green one is precisely the silence this repository refuses. A test that does
# not hold every time is a test whose claim is false; the repair is at the test.
retries = 0

# CHOSEN: report a slow test and never kill one in the lawful profile. No
# qualified hosted worst-case duration exists from which to derive a lawful
# termination threshold. The reversal below is different: its duration is an
# instruction and its one-second termination is the planted defect.
slow-timeout = { period = "60s" }

# CHOSEN: print a failing test's output where it happened AND again at the end.
# A hosted log is read from the bottom, and a run with `fail-fast = false` can
# put a thousand lines between a failure and the summary.
failure-output = "immediate-final"

# THE PLANTED REVERSAL: a profile that is deliberately wrong, kept on purpose.
#
# The lawful profile above establishes one thing when it passes: the tests hold
# today. It establishes nothing about whether this configuration is READ. A key
# nextest stopped honouring, a file moved out from under the tool's search, a
# profile name that stopped resolving — every one of those leaves the same green
# summary as a run that used every line above. A gate whose refusal has never
# been executed is a gate nobody has watched work, and this repository does not
# admit one; `deny-reversal.toml` exists for that reason and this profile exists
# for the same one.
#
# WHY A PROFILE HERE RATHER THAN A SEPARATE FILE, which is where the dependency
# gate puts its reversal. A second file would replace this configuration
# wholesale, so a refusal it produced would prove that nextest refuses and
# nothing about whether THIS file is live. A reversal profile is read out of the
# same file the lawful profile is read out of: the day this file stops being
# found, the reversal stops refusing and the step that requires a refusal turns
# red. One artifact, both facts.
#
# WHAT IS PLANTED. The profile selects the ignored
# `the_nextest_timeout_reversal`, whose body sleeps for thirty seconds, and kills
# it after one. The deterministic sleep is independent of compilation caches and
# runner warmth. The harness command is the only route that lifts the ignore.
# Two command-line requirements follow:
#
#   - `run-ignored` is NOT a configuration key. MEASURED on 0.9.132: writing it
#     in a profile prints `ignoring unknown configuration key:
#     profile.reversal.run-ignored` and changes nothing, and a filterset cannot
#     name an ignored test either. So the reversal step spells `--run-ignored
#     only` on the command line. That flag does not SELECT anything — the
#     `default-filter` below is the selection, and `only` merely lifts the skip
#     over a population this repository has exactly one member of. `only` rather
#     than `all` on purpose: a subject that lost its `#[ignore]` would silently
#     join every ordinary run under `all`, and under `only` it empties the
#     selection and takes the step red on the next run.
#   - `no-tests` is not a configuration key either, and it is the one that must
#     not be left to a default. MEASURED: `no-tests = "fail"` in a profile prints
#     the same `ignoring unknown configuration key` line, so the step spells
#     `--no-tests fail`. An empty selection then refuses instead of reporting a
#     green run over nothing — which is what a renamed or deleted subject would
#     otherwise buy: `0 tests run: 0 passed`, and a summary line no reader
#     distinguishes from work.
#
# The harness requires exit 100, a `timed out` diagnostic, and the planted
# subject's name. A code alone could be a usage error; a timeout alone could name
# another test.
#
# THE ONE WAY THIS REVERSAL CAN STOP BEING ABOUT ANYTHING is the subject being
# renamed or deleted, and it does not go silent when that happens: the selection
# empties, `--no-tests fail` refuses, and the step reds. It cannot stop being
# about anything by becoming FAST, which is the way the plant this replaced
# stopped.
#
# WHAT THIS REVERSAL COVERS: that this file is read, that a profile in it is
# resolved and applied, that a filterset written here decides what runs, that
# `terminate-after` is honoured, and that nextest's refusal path exits non-zero
# and says why. What it does NOT cover: `fail-fast`, `retries`, and
# `failure-output` above — one test is selected here, so nothing about how a run
# behaves after a second failure is exercised, and any of the three could stop
# being honoured tomorrow leaving both this run and the lawful one reading
# exactly as they read now. Those three stand on a positive invocation alone.
# That is a debt NAMED here rather than discharged, and the shape that would
# discharge it is one more deliberately wrong profile per setting, each requiring
# its own exit code and its own diagnostic.
#
# Only the two keys that ARE the plant are written below. A profile inherits
# every other setting from `default`, so restating one here would be a second
# place the lawful value lives and the first thing to drift.
[profile.reversal]
default-filter = 'test(the_nextest_timeout_reversal)'
slow-timeout = { period = "1s", terminate-after = 1 }
