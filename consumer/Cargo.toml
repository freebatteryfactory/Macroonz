[package]
name = "threadpak-consumer"
description = "The outside-consumer parity seat: an ordinary adopter that renames both ThreadPak crates and reaches them under no other name."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# The wall this package stands under is the workspace's, inherited unweakened.
# An adopter outside this repository declares its own; what THIS seat shows is
# that nothing in the machine's public road needs a weaker one.
[lints]
workspace = true

# The declaration contracts and derive shell use the names this consumer chose. Every contract path is spelled `macroonz::`, every derive path is spelled `tp_macros::`, and a reference that resolves only under another spelling does not resolve here.
#
# The shell is an ordinary dependency rather than a development one because the
# declaration it serves is library source: what it delivers at the declaration
# site is the two contract implementations this crate's derived refusal family
# is compiled with, in every build and not only in a test one.
[dependencies]
macroonz = { package = "macroonz", path = "../contracts" }
tp_macros = { package = "threadpak-macros", path = "../macros/proc" }

# The judge, under the name this consumer chose for it, reached only from
# `tests/`. Two facts ride that placement: the harness's own dependency
# direction — production never depends on its judge — and the ordinary shape of
# a consumer, whose testing lives in its tests.
[dev-dependencies]
harness = { package = "threadpak-testpak", path = "../harness" }
