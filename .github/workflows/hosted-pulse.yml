name: Hosted pulse

run-name: Hosted pulse for ${{ github.ref_name }}

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hosted-pulse-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  RUSTDOCFLAGS: -Dwarnings

jobs:
  linux-x64:
    name: Linux x64 complete wall
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 45

    steps:
      - name: Check out the declared revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Restore declared Cargo registry material
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git/db
          key: cargo-home-${{ runner.os }}-${{ runner.arch }}-rust-1.98.0-${{ hashFiles('Cargo.lock') }}

      - name: Install the declared Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy --component rust-src --component llvm-tools-preview --target wasm32-unknown-unknown

      - name: Install declared qualification tools
        uses: taiki-e/install-action@5b4d68e2e660441203ab128a23676f1e4faf1532 # v2.86.3
        with:
          tool: cargo-nextest@0.9.132,cargo-deny@0.19.0
          fallback: none

      - name: Record host and tool identities
        run: |
          uname -a
          rustc +1.98.0 --version --verbose
          cargo +1.98.0 --version --verbose
          cargo nextest --version
          cargo deny --version

      - name: Fetch the locked dependency graph
        run: |
          cargo +1.98.0 fetch --locked
          echo "CARGO_NET_OFFLINE=true" >> "$GITHUB_ENV"

      - name: Check formatting
        run: cargo +1.98.0 fmt --all -- --check

      - name: Check every target and feature
        run: cargo +1.98.0 check --workspace --all-targets --all-features --locked

      - name: Run the strict lint wall
        run: cargo +1.98.0 clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Run the complete external test wall
        run: cargo +1.98.0 nextest run --profile ci -j1 --workspace --all-features --locked --no-fail-fast

      - name: Run documentation examples
        run: cargo +1.98.0 test -j1 --doc --workspace --all-features --locked

      - name: Check dependency policy
        run: cargo deny --workspace check

      - name: Build warnings-denied documentation
        run: cargo +1.98.0 doc --workspace --all-features --no-deps --locked

      - name: Check the all-feature Wasm posture
        run: cargo +1.98.0 check --workspace --all-features --target wasm32-unknown-unknown --locked

      - name: Run the stable-rustc coverage crossing
        run: cargo +1.98.0 run -j1 --example rustc_coverage --features harness --locked

      - name: Refuse tracked-tree mutation
        run: git diff --exit-code HEAD --

  unix-crossings:
    name: ${{ matrix.lane }} host crossing
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: Linux ARM64
            runner: blacksmith-4vcpu-ubuntu-2404-arm
          - lane: macOS ARM64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45

    steps:
      - name: Check out the declared revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Restore declared Cargo registry material
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git/db
          key: cargo-home-${{ runner.os }}-${{ runner.arch }}-rust-1.98.0-${{ hashFiles('Cargo.lock') }}

      - name: Install the declared Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy --component rust-src --component llvm-tools-preview --target wasm32-unknown-unknown

      - name: Install the declared test runner
        uses: taiki-e/install-action@5b4d68e2e660441203ab128a23676f1e4faf1532 # v2.86.3
        with:
          tool: cargo-nextest@0.9.132
          fallback: none

      - name: Record host and tool identities
        run: |
          uname -a
          rustc +1.98.0 --version --verbose
          cargo +1.98.0 --version --verbose
          cargo nextest --version

      - name: Fetch the locked dependency graph
        run: |
          cargo +1.98.0 fetch --locked
          echo "CARGO_NET_OFFLINE=true" >> "$GITHUB_ENV"

      - name: Check every target and feature
        run: cargo +1.98.0 check --workspace --all-targets --all-features --locked

      - name: Run the strict lint wall
        run: cargo +1.98.0 clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Run the complete external test wall
        run: cargo +1.98.0 nextest run --profile ci -j1 --workspace --all-features --locked --no-fail-fast

      - name: Run documentation examples
        run: cargo +1.98.0 test -j1 --doc --workspace --all-features --locked

      - name: Run the stable-rustc coverage crossing
        run: cargo +1.98.0 run -j1 --example rustc_coverage --features harness --locked

      - name: Refuse tracked-tree mutation
        run: git diff --exit-code HEAD --

  windows-x64:
    name: Windows x64 host crossing
    runs-on: windows-2025
    timeout-minutes: 60

    steps:
      - name: Check out the declared revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Restore declared Cargo registry material
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git/db
          key: cargo-home-${{ runner.os }}-${{ runner.arch }}-rust-1.98.0-${{ hashFiles('Cargo.lock') }}

      - name: Install the declared Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy --component rust-src --component llvm-tools-preview --target wasm32-unknown-unknown

      - name: Install the declared test runner
        uses: taiki-e/install-action@5b4d68e2e660441203ab128a23676f1e4faf1532 # v2.86.3
        with:
          tool: cargo-nextest@0.9.132
          fallback: none

      - name: Record host and tool identities
        shell: pwsh
        run: |
          Get-ComputerInfo | Select-Object WindowsProductName, WindowsVersion, OsArchitecture
          rustc +1.98.0 --version --verbose
          cargo +1.98.0 --version --verbose
          cargo nextest --version

      - name: Fetch the locked dependency graph
        shell: pwsh
        run: |
          cargo +1.98.0 fetch --locked
          Add-Content -LiteralPath $env:GITHUB_ENV -Value 'CARGO_NET_OFFLINE=true'

      - name: Check every target and feature
        run: cargo +1.98.0 check --workspace --all-targets --all-features --locked

      - name: Run the strict lint wall
        run: cargo +1.98.0 clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Run the complete external test wall
        run: cargo +1.98.0 nextest run --profile ci -j1 --workspace --all-features --locked --no-fail-fast

      - name: Run documentation examples
        run: cargo +1.98.0 test -j1 --doc --workspace --all-features --locked

      - name: Run the stable-rustc coverage crossing
        run: cargo +1.98.0 run -j1 --example rustc_coverage --features harness --locked

      - name: Refuse tracked-tree mutation
        run: git diff --exit-code HEAD --
