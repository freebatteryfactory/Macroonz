# The hosted runner is a caller. The battery is `cargo xtask qualify`.
#
# The entry bar lives in xtask, so a contributor runs on a working machine the
# exact road a change runs here, and this file names no stage of it. What a
# hosted run supplies is the one thing a working machine cannot: a host nobody
# configured, and a refusal standing between a change and the branch. Changing
# what qualification MEANS is a change to xtask and never a change to this file;
# a stage restated here would be a second definition, and the two would drift the
# first time either was edited alone.
name: qualify

on:
  # Every pull request, whatever it targets.
  pull_request:
  # And direct pushes to the trunk, which are still possible because branch
  # protection is not yet in place. A change that arrives as a pull request and
  # is then merged runs TWICE under this policy: once on the request, once on the
  # resulting push. That duplication is the cost of the cover, and the cover is
  # what matters while a direct push to the trunk can still bypass the request
  # entirely. This trigger is bootstrap-era belt-and-suspenders, and it comes out
  # the day branch protection forbids the direct push it exists to catch — which
  # is a setting on the repository, not an edit to this file.
  push:
    branches: [main]
  # Weekly, on the trunk as it stands.
  #
  # The claim this supports, exactly: the qualification road's verdict is about
  # the tree alone. A weekly run of a tree that has not changed can only change
  # its answer if something OUTSIDE the tree changed — a toolchain component that
  # stopped installing, a target that stopped being available, a registry that
  # stopped serving a pinned version. That has already happened here once, and a
  # green commit going quietly stale is a failure nobody is looking at. It claims
  # nothing about code that has not been written and nothing about revalidating a
  # review.
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

# One live run per ref, EXCEPT on the trunk. Cancelling a superseded pull-request
# run costs nothing, because the newer commit on that branch is the thing to
# judge. Cancelling the trunk's own run destroys the only record of whether a
# merged commit held — nobody re-pushes a merge to get it back — so a run whose
# ref is not a pull request finishes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The run reads the tree and writes nothing back.
permissions:
  contents: read

jobs:
  qualify:
    strategy:
      # Both legs report. A road that stopped on the first red would tell us
      # which host failed and nothing about the other, and the whole reason two
      # hosts run is that they can disagree.
      fail-fast: false
      matrix:
        # Two hosts, because the road claims to be one road. Its spawning stages
        # pass an explicit argument list and an explicit working directory, so
        # no shell parses them and no path separator is ever spelled — and until
        # this leg existed, that claim had never been executed anywhere but a
        # working machine. The Windows leg is also the
        # only one that exercises the interaction between `.gitattributes`, a
        # checkout on a platform whose git converts line endings by default, and
        # a closing stage that refuses any difference from what is committed.
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # The default is six hours. Nothing here is a six-hour job, so a run that
    # reaches this number is a run that stopped making progress, and holding a
    # runner until lunchtime to learn that helps nobody. The number is generous
    # against a cold, uncached compile of the whole workspace on the slower of
    # the two hosts, not tuned to the current runtime.
    timeout-minutes: 45
    steps:
      # Pinned to the exact commit `v4` named when this line was written. A tag
      # is a movable label: whoever can move it can change what a hosted run
      # executes without any change landing here. A commit cannot move, so the
      # pin is what makes "the runner ran this" a statement about known bytes.
      # The tag survives as a comment because the number is what an updater
      # needs and the hash is what the machine needs.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The job reads the tree and writes nothing back, matching the read-only
          # token above. Leaving no credential in the checkout means a later step,
          # or anything a later step runs, has nothing to find.
          persist-credentials: false

      # rust-toolchain.toml is the pin, here as on every machine. Invoked inside
      # the checkout, rustup reads that file and installs the exact channel it
      # names together with the components and targets it declares. The target
      # is then named again out loud: the pin already carries it, and a step
      # that states the requirement makes a silent removal from the pin fail
      # here rather than three stages later.
      - name: Install the pinned toolchain
        run: |
          rustup toolchain install
          rustup target add wasm32-unknown-unknown
          rustup show

      # NO CACHE, DELIBERATELY. Restoring `~/.cargo` and `target` would carry
      # build state produced by earlier runs onto the host this file calls one
      # nobody configured, and the gate would then be qualifying a source tree
      # plus whatever a previous run left in the directory cargo trusts. The
      # first bar the repository stands behind runs cold, because a cold run is
      # the only one whose result is about the tree alone.
      #
      # A cache is an optimization mechanism. It never quietly joins the proof
      # substrate, and it returns to this file only by clearing all five bars:
      #   1. Registry before build output. Downloaded crate sources are content
      #      addressed and cheap to verify; compiled artifacts are neither. The
      #      registry alone is cached first, and `target` only once the registry
      #      is measured and shown insufficient.
      #   2. The caching action is pinned to a full commit, exactly as checkout
      #      is, for exactly the same reason.
      #   3. The key declares every input that influences what is built — the
      #      toolchain pin, the lock file, the feature and target profile — so a
      #      changed influence is a miss rather than a stale hit. A restore-keys
      #      fallback that serves an entry keyed on fewer inputs is a hit whose
      #      influence was not declared, and it does not qualify.
      #   4. A miss and a hit are shown to reach the same qualification outcome
      #      on the same tree, so the cache is proven not to decide anything.
      #   5. Uncached runs stay on a schedule after the cache lands. A cache that
      #      begins lying is only caught by a run that cannot be lied to.

      # The whole bar, in one command that owns its own order and its own
      # reporting. It stops at the first red, so the last line of this log names
      # the one thing to fix.
      - name: Qualify
        run: cargo xtask qualify
