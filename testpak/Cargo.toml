[package]
name = "threadpak-testpak"
description = "The qualification plane: orchestration, hostile execution, and denominators. Production never depends on its judge."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
threadpak = { path = ".." }
threadpak-macroc = { path = "../macros/macroc" }
threadpak-macros = { path = "../macros/proc" }
# The structural lane's parser, admitted by the note in README.md. Which version
# and which features is the workspace's one decision, inherited from the root
# manifest's `[workspace.dependencies]` table rather than restated here.
syn = { workspace = true }

[dev-dependencies]
# The compile-refusal harness, inherited exact from the workspace table.
trybuild = { workspace = true }
# The independent transcript lane's digest, admitted by the note in README.md.
# The judge hashes with the same admitted mechanism the services do — a lane
# that reimplemented BLAKE3 would be testing an arithmetic exercise rather than
# a specification. Inheriting the workspace decision is what makes "the same
# mechanism" a fact rather than two manifests that currently agree: the two
# crates differ in what they ENCODE and in nothing else.
blake3 = { workspace = true }
