[package]
name = "threadpak-testpak"
description = "The qualification plane: orchestration, hostile execution, and denominators. Production never depends on its judge."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
threadpak = { path = ".." }
threadpak-macroc = { path = "../macros/macroc" }
threadpak-macros = { path = "../macros/proc" }
# The structural lane's parser, admitted by the note in README.md. Pinned exact
# to the version the lockfile already carries, and cut to the two features the
# lane uses: `parsing` to read text into an AST at all, `full` because items and
# their associated constants are only in the AST under it. Printing, folding,
# visiting, derive input, and the proc-macro bridge are all off: the lane reads
# and never writes, and never runs inside a macro.
syn = { version = "=3.0.3", default-features = false, features = ["full", "parsing"] }

[dev-dependencies]
trybuild = "1"
# The independent transcript lane's digest, admitted by the note in README.md.
# The judge hashes with the same admitted mechanism the services do — a lane
# that reimplemented BLAKE3 would be testing an arithmetic exercise rather than
# a specification. Pinned exact to the services' own version, and cut to the
# same minimal feature set, so the two crates differ in what they ENCODE and in
# nothing else.
blake3 = { version = "=1.8.6", default-features = false }
