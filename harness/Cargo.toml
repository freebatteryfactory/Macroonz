[package]
name = "macroonz-harness"
description = "An independent test harness: descriptor-driven, property-generated, fault-injected, mutation-pressured, with reports and reduction-minted replay capsules joined on one execution key."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
arbitrary = { workspace = true }
blake3 = { workspace = true }
loom = { workspace = true, optional = true }
syn = { workspace = true }

[features]
default = []
# The memory-model exploration home, wrapping the pinned `loom` scheduler.
# Opt-in: loom's generator dependency does not build on every target the default harness supports,
# so a default that pulled it would trade an ordinary adopter's platform for a test convenience.
# The wall proves this feature by running with --all-features; the default build carries no loom.
preemption = ["dep:loom"]

[dev-dependencies]
macroonz = { path = "../macros/compiler" }
trybuild = { workspace = true }

[[test]]
name = "preemption_exploration"
path = "tests/preemption_exploration/main.rs"
required-features = ["preemption"]

[[bench]]
name = "neutral_receiver"
harness = false
