[package]
name = "macroonz-harness"
description = "An independent test harness: descriptor-driven, property-generated, fault-injected, mutation-pressured, with every verdict carrying its evidence and replay."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
arbitrary = { workspace = true }
blake3 = { workspace = true }
loom = { workspace = true, optional = true }
syn = { workspace = true }

[features]
default = ["preemption"]
# The memory-model exploration home, wrapping the pinned `loom` scheduler.
# On by default so the one wall proves it; disable the feature to build the harness without loom.
preemption = ["dep:loom"]

[dev-dependencies]
macroonz = { path = "../macros/compiler" }
trybuild = { workspace = true }

[[bench]]
name = "neutral_receiver"
harness = false
