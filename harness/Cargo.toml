[package]
name = "macroonz-harness"
description = "An independent test harness: descriptor-driven, property-generated, fault-injected, mutation-pressured, with reports and reduction-minted replay capsules joined on one execution key."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
arbitrary = { workspace = true }
blake3 = { workspace = true }
syn = { workspace = true }

[target.'cfg(any(all(unix, any(target_arch = "aarch64", target_arch = "arm", target_arch = "x86_64", target_arch = "loongarch64", target_arch = "riscv64", all(target_arch = "powerpc64", target_endian = "little"))), all(windows, any(target_arch = "x86_64", target_arch = "aarch64"))))'.dependencies]
loom = { workspace = true, optional = true }

[target.'cfg(any(windows, target_os = "linux", target_os = "macos"))'.dependencies]
frida-gum = { workspace = true, optional = true }
libafl = { workspace = true, optional = true }
libafl_bolts = { workspace = true, optional = true }
serde = { workspace = true, optional = true }

[features]
default = []
# The memory-model exploration home, wrapping the pinned `loom` scheduler.
# Opt-in at this package door; the facade later decides which public posture opens it by default.
# Loom compiles only where its pinned generator backend implements the target.
# Every other target retains the target-neutral result plane and reports typed backend unavailability.
preemption = ["dep:loom"]
# The selected native coverage mechanism, kept out of every ordinary posture.
fuzz-frida = ["dep:frida-gum", "dep:libafl", "dep:libafl_bolts", "dep:serde"]

[dev-dependencies]
macroonz-compiler = { workspace = true }
trybuild = { workspace = true }

[[test]]
name = "preemption_exploration"
path = "tests/preemption_exploration/main.rs"
required-features = ["preemption"]

[[bench]]
name = "neutral_receiver"
harness = false
