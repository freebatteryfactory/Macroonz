[package]
name = "threadpak-macros"
description = "The Rust-facing expansion shell: one thin surface over the metaprogramming services."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
proc-macro = true

[lints]
workspace = true

[dependencies]
# The services, reached by path inside this checkout and by version anywhere
# else. This package is publishable, and a registry resolves nothing by path, so
# a path-only edge here is an edge that works only for the people who already
# have the tree. The requirement restates `workspace.package.version` because a
# dependency requirement cannot inherit it; the two move together or the package
# stops resolving, which is the failure that names itself.
threadpak-macroc = { path = "../compiler", version = "0.0.0" }
