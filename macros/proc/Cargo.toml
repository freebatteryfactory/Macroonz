[package]
name = "macroonz-macros"
description = "Generic trials, bench, and mutations attributes over the macroonz compiler, with the shadow, network, and concurrency declarations beside them."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
exclude = ["tests/support/capture-observer/**"]

[lib]
proc-macro = true

[lints]
workspace = true

[dependencies]
macroonz-compiler = { workspace = true, features = ["host"] }

[dev-dependencies]
mh = { package = "macroonz-harness", path = "../../harness", version = "=0.1.0" }
trybuild.workspace = true
