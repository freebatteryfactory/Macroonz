[package]
name = "macroonz-macros"
description = "Procedural host for Macroonz recipes, trials, benches, mutations, shadow, network, and concurrency declarations."
keywords = ["proc-macro", "attribute-macro", "testing", "codegen", "concurrency"]
categories = ["development-tools::testing", "development-tools::procedural-macro-helpers"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
exclude = [
    "tests/generated_support_crossing.rs",
    "tests/recipe_facade_crossing.rs",
    "tests/support/capture-observer/**",
]

[package.metadata.docs.rs]
all-features = true

[lib]
proc-macro = true

[lints]
workspace = true

[dependencies]
macroonz-compiler = { workspace = true, features = ["host"] }

[dev-dependencies]
mh = { package = "macroonz-harness", path = "../../harness", version = "=0.2.0" }
trybuild.workspace = true
