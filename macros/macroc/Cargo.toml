[package]
name = "threadpak-macroc"
description = "The metaprogramming services: ordinary callable Rust over the machine's public declaration path."
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
threadpak = { path = "../.." }
# The tooling plane's digest, admitted by the note in README.md. Pinned exact,
# because a projection identity is a value the plane hands out and a minor
# version that changed one byte of output would silently rename every identity
# in the tree. Default features are off: `std` buys the `io::Write` adapter and
# the error-trait impls, and the services name neither; `rayon` is not a default
# feature and is never named, because an expansion running inside `rustc` must
# not stand up a thread pool to hash a few kilobytes; `serde`, `zeroize`,
# `mmap`, and the digest-trait previews buy surfaces the plane has no seat for.
# What is left is exactly `Hasher` and `derive_key`, which is the whole
# mechanism the identity profile uses.
blake3 = { version = "=1.8.6", default-features = false }
