[package]
name = "xtask"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

# THE ADMITTED MECHANISM, and what earned it.
#
# The coupling law derives its own population: every collection-shaped refusal
# family declared anywhere in the machine or the services, and the body seat each
# one carries. That is a question about ITEMS — is this a trait implementation,
# is the trait it implements the family contract, which type is it for, is
# `SHAPE` a member of it wherever the author put it, and is a field's declared
# type that type rather than a substring of another one. A line scanner cannot
# answer any of them, and the one that stood here proved it: it recognized a
# family only where the shape constant sat on the line immediately below the
# implementation line, so a doc comment, a blank line, an attribute, or a second
# associated constant in between removed that family from the numerator AND the
# denominator at once. The printed count stayed whole while the guarded
# population shrank, which is the single failure a derived denominator exists to
# prevent. Teaching the scanner otherwise means writing a Rust parser by hand
# inside a repository check, from the same understanding the sources were written
# with — two readings of one understanding agree because they share it.
#
# `syn` is the admitted mechanism. Which version, and which features, is one
# decision the workspace makes for every reader at once, and it is written in
# the root manifest's `[workspace.dependencies]` table; this crate inherits it
# rather than restating it, so the judge's structural lane and this law cannot
# drift into reading Rust by two decoders.
#
# What the admission does NOT buy: nothing is compiled, nothing is resolved, no
# `cfg` is evaluated, and no macro is expanded. The law that reads through it
# states those limits itself, in `src/checks/coupling.rs`, where the reading is.
#
# `proc-macro2` NO LONGER STANDS FOR THE LAW THAT ADMITTED IT, and it stays
# anyway, for a second reading that earned it independently. It arrived for a law
# that judged what band 02's `scope_guard_version!` stamp EMITS, by giving a
# transcriber's metavariables values and parsing the result. That law is deleted:
# the stamp now writes its guard into a module of its own, so the set of roads
# out of a stamped guard is the expansion itself and `rustc` refuses everything
# else — the drain running downward, and the mechanism would have gone with it.
# What holds the edge open is `src/checks/placement.rs`: a crate-root reference
# is a PATH IN A TOKEN STREAM, and `proc-macro2` owns Rust's token grammar, so a
# longer identifier ending in `crate`, the word inside a comment, and the word
# inside a string literal are each what they are rather than a substring match.
# The line reader that stood there before matched text and was wrong about all
# three. So the edge is re-earned at a different reading rather than inherited
# from the deleted one, and this paragraph is where that hand-over is written
# down; the day nothing lexes Rust here, it goes.
#
# THE SAME ADMISSION, ONE CLASS WIDER, and what earned it.
#
# `syn` was admitted because a line scanner cannot answer a question about Rust
# ITEMS. That argument was never about Rust. It is about a reader weaker than the
# one that already owns the language answering questions in it, and this crate
# was doing exactly that in three more languages at once: Cargo's syntax, read by
# cutting a line at its first `=`; Markdown, read by counting fences; and the
# resolved dependency graph, read by matching manifest text. Eleven TOML
# spellings escaped the line reader over one campaign, each repair revealing the
# next, and the printed denominators stayed whole the entire time — which is the
# single failure a derived denominator exists to prevent, arriving through the
# reader that feeds it.
#
# So the same rule now holds for every language this crate reads: the decoder
# that OWNS a language answers questions in it, and no reader here re-derives
# what one of them already establishes.
#
#   - `toml` answers Cargo's syntax. What a manifest DECLARES.
#   - `serde_json` + `serde` answer `cargo metadata --format-version 1`. What
#     Cargo RESOLVES — which is a different question from what a manifest
#     declares, and cargo is its only honest oracle.
#   - `pulldown-cmark` answers Markdown structure. WHICH fenced block a reading
#     is about, so a data block is selected by what the document declares rather
#     than by its position among the fences.
#
# Which version, and which features, is the workspace's one decision, written in
# the root manifest's `[workspace.dependencies]` table and inherited here.
#
# What the admission does NOT buy, in each case: nothing is compiled, no feature
# is resolved by this crate itself, no Markdown is rendered, and no TOML is
# written. The schema of a fenced DATA block — this repository's own obligation
# ledger — is owned here rather than by a decoder, and `src/repository/markdown.rs`
# states the measurement behind that: the ledger blocks this repository commits
# are yaml-SHAPED and are not YAML documents, and every YAML decoder available
# breaks `multiple-versions = "deny"`.
[dependencies]
proc-macro2 = { workspace = true }
pulldown-cmark = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
syn = { workspace = true }
toml = { workspace = true }
