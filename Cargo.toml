[workspace]
resolver = "3"
members = [
    "harness",
    "macros/compiler",
    "macros/proc",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.98.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/freebatteryfactory/Macroonz"

[workspace.dependencies]
arbitrary = { version = "=1.4.2", default-features = false }
syn = { version = "=3.0.3", default-features = false, features = ["full", "parsing"] }
blake3 = { version = "=1.8.6", default-features = false }
trybuild = "=1.0.120"

[profile.release]
overflow-checks = true

[profile.bench]
overflow-checks = true

[workspace.lints.rust]
warnings = { level = "deny", priority = -1 }
unsafe_code = "forbid"
let_underscore_drop = "deny"
meta_variable_misuse = "deny"
missing_docs = "deny"
non_ascii_idents = "deny"
unnameable_types = "deny"
unreachable_pub = "deny"
unused_qualifications = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
arithmetic_side_effects = "deny"
as_conversions = "deny"
dbg_macro = "deny"
default_numeric_fallback = "deny"
excessive_nesting = "deny"
exit = "deny"
expect_used = "deny"
indexing_slicing = "deny"
integer_division = "deny"
iter_over_hash_type = "deny"
let_underscore_must_use = "deny"
mem_forget = "deny"
panic = "deny"
print_stdout = "deny"
print_stderr = "deny"
rest_pat_in_fully_bound_structs = "deny"
shadow_same = "deny"
shadow_unrelated = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
wildcard_enum_match_arm = "deny"
