[package]
name = "macroonz"
description = "Code generation that proves what it made, plus a harness for property, fuzz, fault, schedule, mutation, and benchmark testing."
keywords = ["codegen", "testing", "fuzzing", "proc-macro", "harness"]
categories = ["development-tools::testing", "development-tools::procedural-macro-helpers"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
include = ["/src/**", "/tests/**", "/examples/**", "/skills/**", "/assets/logo.webp", "/assets/favicon.ico", "/assets/diagrams/facade-*.svg", "/assets/diagrams/facade-*.mmd", "/assets/diagrams/OFL.txt", "/assets/diagrams/README.md", "/AGENTS.md", "/CONTRIBUTING.md", "/SECURITY.md", "/Cargo.toml", "/README.md", "/LICENSE-*"]

[package.metadata.docs.rs]
all-features = true

[workspace]
resolver = "3"
members = [
    ".",
    "harness",
    "macros/compiler",
    "macros/proc",
]
exclude = [
    "macros/proc/tests/support/capture-observer",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.98.1"
license = "MIT OR Apache-2.0"
repository = "https://github.com/freebatteryfactory/Macroonz"

[workspace.dependencies]
serde = { version = "=1.0.229", default-features = false, features = ["alloc"] }
serde_json = { version = "=1.0.151", default-features = false, features = ["alloc"] }
arbitrary = { version = "=1.4.2", default-features = false }
syn = { version = "=3.0.3", default-features = false, features = ["full", "parsing"] }
blake3 = { version = "=1.8.6", default-features = false }
ra-ap-rustc_lexer = { version = "=0.174.0", default-features = false }
trybuild = "=1.0.120"
cap-std = { version = "=3.4.6", default-features = false }
process-wrap = { version = "=10.0.0", default-features = false, features = ["std", "creation-flags", "job-object"] }
rustix = { version = "=1.1.4", default-features = false, features = ["std", "process"] }
windows = { version = "=0.62.2", default-features = false, features = ["Win32_System_Threading"] }
macroonz-compiler = { path = "macros/compiler", version = "=0.2.0" }
macroonz-harness = { path = "harness", version = "=0.2.0", default-features = false }
macroonz-macros = { path = "macros/proc", version = "=0.2.0" }

[features]
default = ["full"]
harness = ["dep:macroonz-harness", "dep:serde_json"]
preemption = ["harness", "macroonz-harness/preemption"]
full = ["harness", "preemption"]
native-tooling = ["harness", "dep:cap-std", "dep:process-wrap", "dep:rustix", "dep:windows", "dep:serde", "dep:serde_json"]

[dependencies]
macroonz-compiler = { workspace = true, features = ["host"] }
macroonz-harness = { workspace = true, optional = true }
macroonz-macros = { workspace = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[target.'cfg(any(unix, windows))'.dependencies]
cap-std = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
process-wrap = { workspace = true, optional = true }
windows = { workspace = true, optional = true }

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
rustix = { workspace = true, optional = true }

[[test]]
name = "facade_harness_surface"
path = "tests/facade_harness_surface.rs"
required-features = ["harness"]

[[test]]
name = "recipe_surface"
