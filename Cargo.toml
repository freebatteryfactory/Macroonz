[package]
name = "threadpak"
description = "A host-neutral semantic machine: programs are typed data, not text."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[workspace]
resolver = "3"
members = [
    "macros/macroc",
    "macros/proc",
    "testpak",
    "xtask",
    "xtask/fixtures/macro-consumer",
    "xtask/fixtures/renamed-consumer",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
# The floor is the pin. `rust-version = "1.97"` means 1.97.0, and nothing has
# ever been built on 1.97.0 here: `rust-toolchain.toml` pins 1.97.1, every
# hosted run installs 1.97.1, and every working machine resolves 1.97.1. A floor
# nobody stands on is a claim nobody tested, so the floor is stated as the
# version that is actually underneath the build. `one-toolchain-floor` joins
# this line to the pin, to the README, and to `clippy.toml`, which is why the
# disagreement is now unrepresentable rather than merely absent.
rust-version = "1.97.1"
license = "MIT OR Apache-2.0"
repository = "https://github.com/freebatteryfactory/ThreadPak"

# Every third-party version and feature cut this workspace decides, decided
# once. Two members that spelled the same exact pin were never agreement — they
# were two places a later edit could disagree, and nothing would have caught the
# disagreement, because either spelling on its own still compiles. What moved
# here is only the FACT: which version, and which features. WHY a member reaches
# for a mechanism at all stays at that member, beside the reading it buys, since
# that reason differs at every home even when the pin is identical.
#
# Members inherit with `{ workspace = true }`, never the dotted
# `name.workspace = true`. The two are one declaration to Cargo, and the inline
# form is the one the topology law can read: a reader that splits an entry at
# its first `=` sees the key `threadpak-macroc` in the inline form and the key
# `threadpak-macroc.workspace` in the dotted one, and that second name matches
# no package, so a banned edge written the dotted way would pass. The spelling
# is load-bearing until that law reads a resolved graph instead of manifest
# text.
#
# What this table declares is what the workspace ASKS FOR. What the resolved
# graph actually enables is a different question, because Cargo unifies features
# across a build and any dependency may turn one on. `deny.toml` is where that
# second question is answered against the graph itself; the two are not a copy
# of one fact, they are a request and its settlement, and the whole reason both
# exist is that they can disagree.
[workspace.dependencies]
# The Rust decoder, so the judge's structural lane and the repository's coupling
# law read Rust through one decoder at one version rather than through two.
# Default features off, cut to the two the readings use: `parsing`, without
# which there is no text-to-tree road at all, and `full`, without which items
# and their associated constants are not in the tree. Printing, folding,
# visiting, derive input, extra traits, and the proc-macro bridge are not asked
# for HERE — both readers read and never write, and neither runs inside a macro.
# What the graph then holds is a separate measured fact, and `deny.toml` is where
# it is written down, because four of those features do arrive through a crate
# the compile-refusal harness brings in. It is also where the CEILING on that
# settlement is stated: a graph rule reads the graph, so a third fact — what any
# one compiled unit is handed — is settled by neither file.
syn = { version = "=3.0.3", default-features = false, features = ["full", "parsing"] }
# The digest. Pinned exact because a projection identity is a value the plane
# hands out, and a minor version that changed one byte of output would silently
# rename every identity in the tree. Default features off: `std` buys the
# `io::Write` adapter and the error-trait impls and neither crate names them;
# `rayon` must never stand a thread pool up inside `rustc` to hash a few
# kilobytes; `serde`, `zeroize`, `mmap`, and the digest-trait previews buy
# surfaces neither crate has a seat for. What is left is `Hasher` and
# `derive_key`.
blake3 = { version = "=1.8.6", default-features = false }
# The compile-refusal harness, exact for the reason every other decision here is
# exact: a refusal fixture compares a diagnostic byte for byte against a file in
# the tree, so a harness free to move under a caret requirement could rewrite
# what that comparison means without any change landing in the repository.
trybuild = "=1.0.120"

[profile.release]
# Release arithmetic traps instead of wrapping; defense in depth behind the
# source-level arithmetic lints, never permission for bare arithmetic.
overflow-checks = true

[profile.bench]
# Release arithmetic traps instead of wrapping; defense in depth behind the
# source-level arithmetic lints, never permission for bare arithmetic.
overflow-checks = true

# The lint wall is declared here once and inherited by every member; no member
# weakens it. `#[allow]` is refused outright, so the single escape hatch is
# `#[expect]`, and it is disciplined: an expectation names the exact lint,
# carries a mandatory reason, and sits on the narrowest item that contains the
# concern — never a module, never a crate. One expectation states one concern;
# two concerns are two expectations. The reason states the structural fact that
# makes the lint wrong there, not the inconvenience it causes. Because an
# unfulfilled expectation is itself a warning and warnings are denied, an
# expectation that outlives its cause fails the build, which is why the wall
# admits this hatch and refuses the silent one. Generated code never emits an
# expectation: an expansion that needs one is an expansion whose plan is wrong.
#
# REFUSED ON THE RECORD. A wall this dense is only honest if the lints it
# declines are named, because an unnamed absence reads as an oversight.
#   - `exhaustive_structs` and `exhaustive_enums` demand `#[non_exhaustive]`,
#     and this machine's rosters are closed BY LAW. Adding a variant must break
#     every match that handles the roster; `#[non_exhaustive]` exists to stop
#     exactly that break, so adopting these lints would convert the machine's
#     strongest structural alarm into silence.
#   - `tests_outside_test_module` refuses integration tests under `tests/`,
#     which is cargo's own model for out-of-crate test targets. A lint may not
#     overrule the build system's layout.
#   - `min_ident_chars` cannot tell a meaningless name from a conventional one.
#     Lifetime and closure-parameter brevity is idiom, not sloppiness, and the
#     lint has no way to separate them.
#   - Blanket `missing_copy_implementations` and `missing_debug_implementations`
#     force trait surface onto every type regardless of whether the type wants
#     it. `Copy` is a semantic promise about duplication and `Debug` is an
#     output surface; both are decided per type, and identity-bearing types
#     deliberately decline the first.
#   - Blanket `absolute_paths` penalizes the fully-qualified form exactly where
#     it is clearest — disambiguating a one-off reference — while saying nothing
#     about the import hygiene it is reached for.
#   - `missing_docs_in_private_items` is refused as a blanket gate. Private
#     fields earn their documentation when the restructure gives them their home
#     in `type_guard.rs` beside the invariant they carry; a blanket gate would
#     buy that documentation now at the price of writing it twice.
#   - `variant_size_differences` is a physical-layout signal, not a semantic
#     one. It is adopted only alongside measurement of a real layout cost;
#     switched on blind it forces boxing that trades a cache line for an
#     allocation with nothing observed either way.
# ADOPTED IN PRINCIPLE, NOT YET LANDED: `map_err_ignore`. Discarding the source
# error is a real defect and the lint names it correctly. It lands once its sites
# are classified and repaired so each preserves its source, and that repair
# arrives with the laws-drain boundary rather than as a mechanical sweep. No
# count stands here: the number this comment used to carry was authored before
# the lint was ever run over the tree, and a debt figure nobody re-measured is a
# figure that decides nothing. It is measured at adoption, by running the lint.
[workspace.lints.rust]
warnings = { level = "deny", priority = -1 }
unsafe_code = "forbid"
let_underscore_drop = "deny"
meta_variable_misuse = "deny"
missing_docs = "deny"
non_ascii_idents = "deny"
unnameable_types = "deny"
unreachable_pub = "deny"
unused_qualifications = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
arithmetic_side_effects = "deny"
as_conversions = "deny"
dbg_macro = "deny"
default_numeric_fallback = "deny"
expect_used = "deny"
indexing_slicing = "deny"
integer_division = "deny"
iter_over_hash_type = "deny"
let_underscore_must_use = "deny"
mem_forget = "deny"
panic = "deny"
rest_pat_in_fully_bound_structs = "deny"
shadow_same = "deny"
shadow_unrelated = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
wildcard_enum_match_arm = "deny"
