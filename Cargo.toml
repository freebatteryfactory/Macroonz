[package]
name = "macroonz"
description = "One module-preserving front door for the Macroonz compiler, procedural declarations, and test harness."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
include = ["src/**", "tests/**", "assets/**", "AGENTS.md", "CONTRIBUTING.md", "SECURITY.md", "Cargo.toml", "README.md", "LICENSE-*"]

[workspace]
resolver = "3"
members = [
    ".",
    "harness",
    "macros/compiler",
    "macros/proc",
]
exclude = [
    "macros/proc/tests/support/capture-observer",
    "qualification/durafx-sealer",
    "qualification/fuzz-frida-windows/source",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/freebatteryfactory/Macroonz"

[workspace.dependencies]
arbitrary = { version = "=1.4.2", default-features = false }
syn = { version = "=3.0.3", default-features = false, features = ["full", "parsing"] }
blake3 = { version = "=1.8.6", default-features = false }
loom = { version = "=0.7.2", default-features = false, features = ["futures"] }
ra-ap-rustc_lexer = { version = "=0.174.0", default-features = false }
trybuild = "=1.0.120"
macroonz-compiler = { path = "macros/compiler", version = "=0.1.0" }
macroonz-harness = { path = "harness", version = "=0.1.0", default-features = false }
macroonz-macros = { path = "macros/proc", version = "=0.1.0" }

[features]
default = ["full"]
harness = ["dep:macroonz-harness"]
preemption = ["harness", "macroonz-harness/preemption"]
full = ["harness", "preemption"]

[dependencies]
macroonz-compiler = { workspace = true, features = ["host"] }
macroonz-harness = { workspace = true, optional = true }
macroonz-macros = { workspace = true }

[[test]]
name = "facade_harness_surface"
path = "tests/facade_harness_surface.rs"
required-features = ["harness"]

[lints]
workspace = true

[profile.release]
overflow-checks = true

[profile.bench]
overflow-checks = true

[workspace.lints.rust]
warnings = { level = "deny", priority = -1 }
unsafe_code = "forbid"
# The loom configuration is a declared input of this workspace: the shadow road emits it, and adopters build under it.
unexpected_cfgs = { level = "deny", check-cfg = ["cfg(loom)"] }
let_underscore_drop = "deny"
meta_variable_misuse = "deny"
missing_docs = "deny"
non_ascii_idents = "deny"
unnameable_types = "deny"
unreachable_pub = "deny"
unused_qualifications = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
arithmetic_side_effects = "deny"
as_conversions = "deny"
dbg_macro = "deny"
default_numeric_fallback = "deny"
excessive_nesting = "deny"
exit = "deny"
expect_used = "deny"
indexing_slicing = "deny"
integer_division = "deny"
iter_over_hash_type = "deny"
let_underscore_must_use = "deny"
mem_forget = "deny"
panic = "deny"
print_stdout = "deny"
print_stderr = "deny"
rest_pat_in_fully_bound_structs = "deny"
shadow_same = "deny"
shadow_unrelated = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
wildcard_enum_match_arm = "deny"
