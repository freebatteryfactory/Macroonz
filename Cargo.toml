[lints]
workspace = true

[profile.release]
overflow-checks = true

[profile.bench]
overflow-checks = true

[workspace.lints.rust]
warnings = { level = "deny", priority = -1 }
unsafe_code = "forbid"
# The loom configuration is a declared input of this workspace: the shadow road emits it, and adopters build under it.
unexpected_cfgs = { level = "deny", check-cfg = ["cfg(loom)"] }
let_underscore_drop = "deny"
meta_variable_misuse = "deny"
missing_docs = "deny"
non_ascii_idents = "deny"
unnameable_types = "deny"
unreachable_pub = "deny"
unused_qualifications = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
arithmetic_side_effects = "deny"
as_conversions = "deny"
dbg_macro = "deny"
default_numeric_fallback = "deny"
excessive_nesting = "deny"
exit = "deny"
expect_used = "deny"
indexing_slicing = "deny"
integer_division = "deny"
iter_over_hash_type = "deny"
let_underscore_must_use = "deny"
mem_forget = "deny"
panic = "deny"
print_stdout = "deny"
print_stderr = "deny"
rest_pat_in_fully_bound_structs = "deny"
shadow_same = "deny"
shadow_unrelated = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
wildcard_enum_match_arm = "deny"
