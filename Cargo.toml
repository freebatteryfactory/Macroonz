[package]
name = "threadpak"
description = "A host-neutral semantic machine: programs are typed data, not text."
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[workspace]
resolver = "3"
members = ["macros/macroc", "macros/proc", "xtask", "xtask/fixtures/macro-consumer"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.97"

[workspace.lints.rust]
warnings = { level = "deny", priority = -1 }
unsafe_code = "forbid"
missing_docs = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
allow_attributes = "deny"
arithmetic_side_effects = "deny"
dbg_macro = "deny"
expect_used = "deny"
indexing_slicing = "deny"
iter_over_hash_type = "deny"
mem_forget = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
