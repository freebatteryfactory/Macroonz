[package]
name = "threadpak"
description = "Embedded, sync-first, event-native database and runtime: typed declarations in, accepted history as the authority, receipts, replay, and derived projections."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[workspace]
resolver = "3"
members = [
    "consumer",
    "macros/macroc",
    "macros/proc",
    "testpak",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
# The floor is the pin: 1.97.1 is the version every build actually stands on.
rust-version = "1.97.1"
license = "MIT OR Apache-2.0"
repository = "https://github.com/freebatteryfactory/ThreadPak"

# Every third-party version and feature cut is decided once, here, exact. WHY a
# member reaches for a mechanism stays at that member, beside the reading it
# buys. `deny.toml` settles what the resolved graph actually enables.
[workspace.dependencies]
# Structure-aware input generation: the harness library's shared generation
# vocabulary, the trait alone.
arbitrary = { version = "=1.4.2", default-features = false }
# The Rust decoder for the judge's structural lane: `parsing` + `full`, nothing else.
syn = { version = "=3.0.3", default-features = false, features = ["full", "parsing"] }
# The digest. Exact because one changed output byte silently renames every
# identity. No std, no rayon, no serde: `Hasher` and `derive_key` are the surface.
blake3 = { version = "=1.8.6", default-features = false }
# The compile-refusal harness. Exact: fixtures compare diagnostics byte for byte.
trybuild = "=1.0.120"

[profile.release]
# Release arithmetic traps instead of wrapping; defense in depth behind the
# source-level arithmetic lints, never permission for bare arithmetic.
overflow-checks = true

[profile.bench]
# The same trap, pre-declared. No bench target exists, so this profile governs
# nothing today; it stands so the first bench to land cannot quietly measure
# wrapping arithmetic and call the number a measurement.
overflow-checks = true

# The lint wall, declared once and inherited by every member; no member weakens
# it. `#[allow]` is refused; `#[expect]` is the one hatch — exact lint, mandatory
# reason, narrowest item. An unfulfilled expectation is itself a denied warning,
# so an expectation that outlives its cause fails the build.
[workspace.lints.rust]
warnings = { level = "deny", priority = -1 }
unsafe_code = "forbid"
let_underscore_drop = "deny"
meta_variable_misuse = "deny"
missing_docs = "deny"
non_ascii_idents = "deny"
unnameable_types = "deny"
unreachable_pub = "deny"
unused_qualifications = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
arithmetic_side_effects = "deny"
as_conversions = "deny"
dbg_macro = "deny"
default_numeric_fallback = "deny"
excessive_nesting = "deny"
exit = "deny"
expect_used = "deny"
indexing_slicing = "deny"
integer_division = "deny"
iter_over_hash_type = "deny"
let_underscore_must_use = "deny"
mem_forget = "deny"
panic = "deny"
print_stdout = "deny"
print_stderr = "deny"
rest_pat_in_fully_bound_structs = "deny"
shadow_same = "deny"
shadow_unrelated = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
wildcard_enum_match_arm = "deny"
