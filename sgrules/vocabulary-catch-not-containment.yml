# Vocabulary law: the harness's word for subject-panic handling is CATCH;
# "containment" belongs to another band's vocabulary exclusively, repo-wide,
# so the collision is structurally impossible.
id: vocabulary-catch-not-containment
message: "the harness catches; containment is another band's word — rename to catch"
severity: warning
language: rust
files:
  - testpak/**
rule:
  all:
    - kind: identifier
    - regex: "[Cc]ontain"
