# The anti-escape-hatch rule: hand-written trial wiring that bypasses
# descriptors is how the sugar road erodes. A #[test] inside the harness
# library body (outside tests/ and outside the stamps' expansions) is a
# trial without a row. Advisory until its signal quality is observed.
id: anti-escape-hatch-no-bare-tests-in-library
message: "a trial without a descriptor row bypasses the vocabulary; wire it through a row and the stamp"
severity: warning
language: rust
files:
  - testpak/src/**
rule:
  pattern: "#[test]"
