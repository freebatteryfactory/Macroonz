[graph]
exclude-dev = false

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "CC0-1.0",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
]

[bans]
multiple-versions = "deny"
wildcards = "deny"
allow-wildcard-paths = true

[[bans.features]]
crate = "syn"
allow = ["clone-impls", "derive", "full", "parsing", "printing", "proc-macro"]
exact = true

[[bans.features]]
crate = "blake3"
allow = []
exact = true

[[bans.features]]
crate = "arbitrary"
allow = []
exact = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
